server:
  port: ${PORT:8080}

spring:
  application:
    name: syncnotes-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:syncnotesdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 min
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

storage:
  provider: ${STORAGE_PROVIDER:local}
  local-dir: ${STORAGE_LOCAL_DIR:./uploads}

notion:
  api-key: ${NOTION_API_KEY:}
  database-id: ${NOTION_DATABASE_ID:}

logging:
  level:
    root: INFO
    com.syncnotes: INFO
