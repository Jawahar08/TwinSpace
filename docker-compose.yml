version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncnotes-postgres
    environment:
      POSTGRES_DB: syncnotes
      POSTGRES_USER: syncnotes_user
      POSTGRES_PASSWORD: syncnotes_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncnotes_user -d syncnotes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
